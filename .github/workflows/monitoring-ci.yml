name: Monitoring CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Test and validate monitoring stack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run automated tests
        run: PYTHONPATH=. pytest -q

      - name: Run Python security scan
        run: bandit -q -r app.py

      - name: Validate YAML files
        run: |
          python -c "from pathlib import Path; import yaml; [yaml.safe_load(path.read_text()) for path in Path('.').rglob('*.yml')]; print('YAML validation passed')"

      - name: Validate Grafana dashboard JSON
        run: python -m json.tool grafana/dashboards/application-dashboard.json > /dev/null

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "${{ github.workspace }}/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.2.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Build application container
        run: docker build -t cloud-monitoring-app:test .
