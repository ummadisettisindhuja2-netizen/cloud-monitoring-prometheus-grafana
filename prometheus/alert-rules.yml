groups:
  - name: application-alerts
    rules:
      - alert: ApplicationDown
        expr: up{job="monitoring-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Monitoring application is unavailable"
          description: "Prometheus has been unable to scrape the application for more than one minute."

      - alert: HighRequestLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High application response time"
          description: "The 95th percentile request latency has exceeded 0.5 seconds for two minutes."
